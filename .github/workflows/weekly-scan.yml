name: Weekly Market Scanner

on:
  schedule:
    # This is 09:00 AM South African time (07:00 UTC) on every Saturday.
    - cron: '0 7 * * 6'
  workflow_dispatch: # This lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python market_scanner_report.py

      - name: Save scan state for next week
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add scan_state.json
          git diff --staged --quiet || git commit -m "Update scan state"
          git push
